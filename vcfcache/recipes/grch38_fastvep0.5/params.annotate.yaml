## * REQUIRED RESOURCES *
genome_build: "GRCh38"
annotation_tool_cmd: "fastvep"
tool_version_command: "fastvep --version"
bcftools_cmd: "bcftools"
temp_dir: "/tmp"
threads: 8

## * fastVEP RESOURCES *
rayon_threads: 8
transcript_cache: "/data/fastvep/GRCh38/Homo_sapiens.GRCh38.fastvep.cache"
fasta: "/data/fastvep/GRCh38/Homo_sapiens.GRCh38.dna.toplevel.fa"
# The SAME sources in 1 kb blocks, used for the variants missing from the cache
# (sa-build --chunk-bits 10). Output is identical; see README.md.
# Whole genomes only: for panels and other small inputs use params.yaml.
sa_dir: "/data/fastvep/sa/GRCh38_1kb"

optional_checks: {}
