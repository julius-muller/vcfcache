[package]
name = "vcfcache-engine"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Experimental fused BCF router for VCFcache"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rust-htslib = { version = "1.0.1", default-features = false, features = ["libdeflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
